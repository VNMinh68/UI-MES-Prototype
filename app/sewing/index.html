<!-- Thu vien dung chung, nguyen ban tu bundle goc -->
<script src="../vendor/react.js"></script>

<script src="../vendor/xlsx.js"></script>
<!-- xlsx-js-style: ban fork cua SheetJS (cung nhan 0.18.5) GHI duoc dinh dang o
     - font, vien, mau nen, can le - thu ma ban CE khong lam duoc. No cung tu gan
     vao window.XLSX, nen phai cat ban goc di roi tra lai: moi cho dang doc/ghi
     file van chay tren SheetJS cu, chi rieng ban in mau bao cao QC dung ban co
     dinh dang qua window.XLSXStyle. cptable do vendor/xlsx.js o tren khai bao. -->
<script>window.__XLSX_PLAIN__ = window.XLSX;</script>
<script src="../vendor/xlsx-style.js"></script>
<script>window.XLSXStyle = window.XLSX; window.XLSX = window.__XLSX_PLAIN__;</script>

<!-- Seed cua module: don hang tren cac chuyen + tac nghiep cat + anh chup du lieu.
     Nap TRUOC script.js nen window.SEWING_SEED luon co san luc dung component. -->
<script src="seed.js"></script>

<!-- Nen dung chung, roi den logic cua module -->
