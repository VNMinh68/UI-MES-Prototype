<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YIC MES — Hệ thống điều hành sản xuất</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>

<!-- Third-party, verbatim from the bundle -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/anime.js"></script>
<script src="vendor/xlsx.js"></script>
<!-- xlsx-js-style: ban fork cua SheetJS (cung nhan 0.18.5) GHI duoc dinh dang o
     - font, vien, mau nen, can le - thu ma ban CE khong lam duoc. No cung tu gan
     vao window.XLSX, nen phai cat ban goc di roi tra lai: moi cho dang doc/ghi
     file van chay tren SheetJS cu, chi rieng ban in mau bao cao QC dung ban co
     dinh dang qua window.XLSXStyle. cptable do vendor/xlsx.js o tren khai bao. -->
<script>window.__XLSX_PLAIN__ = window.XLSX;</script>
<script src="vendor/xlsx-style.js"></script>
<script>window.XLSXStyle = window.XLSX; window.XLSX = window.__XLSX_PLAIN__;</script>
<script src="vendor/qr.js"></script>

<!-- Data. Loaded before the app, so window.KHC / window.PSCHED are always ready
     by the time script.js constructs the component. -->
<script src="data/khc.js"></script>
<script src="data/psched.js"></script>
<script src="data/mlist.js"></script>

<!-- Ảnh chụp dữ liệu người dùng (localStorage + IndexedDB). Sinh ra từ nút
     "Xuất ảnh chụp" trong sidebar; máy nào mở app lần đầu sẽ được nạp từ đây. -->
<script src="data/state-seed.js"></script>

<script src="script.js"></script>
</body>
</html>
